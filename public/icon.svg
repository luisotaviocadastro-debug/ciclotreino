<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="504" height="504" rx="124" stroke="#1e293b" stroke-width="8" fill="none"/>
  
  <!-- Continuous cycle arrows behind dumbbell -->
  <path d="M 256 90 A 166 166 0 0 1 422 256 A 166 166 0 0 1 386 362" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.35"/>
  <path d="M 256 422 A 166 166 0 0 1 90 256 A 166 166 0 0 1 126 150" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.85"/>
  
  <!-- Arrow heads -->
  <polygon points="126,120 156,165 110,170" fill="#10b981"/>
  <polygon points="386,392 356,347 402,342" fill="#38bdf8" opacity="0.5"/>

  <!-- Stylized Dumbbell / Weight Centerpiece -->
  <g transform="translate(256, 256) rotate(-35)">
    <!-- Central Bar -->
    <rect x="-130" y="-12" width="260" height="24" rx="12" fill="#e2e8f0"/>
    <!-- Center Knurl Grip Lines -->
    <line x1="-50" y1="-12" x2="-50" y2="12" stroke="#94a3b8" stroke-width="4"/>
    <line x1="-30" y1="-12" x2="-30" y2="12" stroke="#94a3b8" stroke-width="4"/>
    <line x1="30" y1="-12" x2="30" y2="12" stroke="#94a3b8" stroke-width="4"/>
    <line x1="50" y1="-12" x2="50" y2="12" stroke="#94a3b8" stroke-width="4"/>
    
    <!-- Left Inner Collar -->
    <rect x="-142" y="-24" width="12" height="48" rx="4" fill="#cbd5e1"/>
    <!-- Left Outer Big Plate -->
    <rect x="-172" y="-72" width="26" height="144" rx="10" fill="url(#primaryGrad)"/>
    <!-- Left Inner Smaller Plate -->
    <rect x="-194" y="-56" width="18" height="112" rx="8" fill="#047857"/>

    <!-- Right Inner Collar -->
    <rect x="130" y="-24" width="12" height="48" rx="4" fill="#cbd5e1"/>
    <!-- Right Outer Big Plate -->
    <rect x="146" y="-72" width="26" height="144" rx="10" fill="url(#primaryGrad)"/>
    <!-- Right Inner Smaller Plate -->
    <rect x="176" y="-56" width="18" height="112" rx="8" fill="#047857"/>
  </g>
</svg>
